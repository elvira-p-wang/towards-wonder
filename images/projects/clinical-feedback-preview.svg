<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="540" fill="#f7f4ee" rx="14"/>

  <!-- browser chrome -->
  <rect x="0" y="0" width="900" height="34" fill="#efe9dd" rx="14"/>
  <rect x="0" y="20" width="900" height="14" fill="#efe9dd"/>
  <circle cx="22" cy="17" r="5" fill="#e2b3a8"/>
  <circle cx="40" cy="17" r="5" fill="#e6d2a0"/>
  <circle cx="58" cy="17" r="5" fill="#a9c9b3"/>

  <!-- header -->
  <text x="40" y="78" font-size="15" letter-spacing="2" fill="#837b73" font-family="Helvetica, Arial, sans-serif">CLINICAL FEEDBACK TO ACTION &#183; REFLECTION TOOL</text>
  <text x="40" y="112" font-size="33" fill="#262220">Feedback to Action</text>
  <text x="40" y="136" font-size="14" fill="#837b73" font-family="Helvetica, Arial, sans-serif">Turns placement feedback into reflections you&#8217;ll actually finish writing.</text>

  <!-- overview cards -->
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- card 1 -->
    <rect x="40" y="160" width="260" height="112" rx="12" fill="#fffefb" stroke="#e6ded2"/>
    <text x="60" y="188" font-size="11" letter-spacing="1" fill="#837b73">STRENGTHS</text>
    <text x="60" y="216" font-size="24" fill="#262220" font-family="Georgia, serif">6</text>
    <rect x="60" y="230" width="220" height="5" rx="2.5" fill="#efe9dd"/>
    <rect x="60" y="230" width="150" height="5" rx="2.5" fill="#55806b"/>
    <text x="60" y="254" font-size="11" fill="#55806b">Noted this placement</text>

    <!-- card 2 -->
    <rect x="320" y="160" width="260" height="112" rx="12" fill="#fffefb" stroke="#e6ded2"/>
    <text x="340" y="188" font-size="11" letter-spacing="1" fill="#837b73">GROWTH AREAS</text>
    <text x="340" y="216" font-size="24" fill="#262220" font-family="Georgia, serif">4</text>
    <rect x="340" y="230" width="220" height="5" rx="2.5" fill="#efe9dd"/>
    <rect x="340" y="230" width="110" height="5" rx="2.5" fill="#af7c3f"/>
    <text x="340" y="254" font-size="11" fill="#af7c3f">Ranked by urgency</text>

    <!-- card 3 -->
    <rect x="600" y="160" width="260" height="112" rx="12" fill="#fffefb" stroke="#e6ded2"/>
    <text x="620" y="188" font-size="11" letter-spacing="1" fill="#837b73">CONTEXT NOTES</text>
    <text x="620" y="216" font-size="24" fill="#262220" font-family="Georgia, serif">3</text>
    <rect x="620" y="230" width="220" height="5" rx="2.5" fill="#efe9dd"/>
    <rect x="620" y="230" width="80" height="5" rx="2.5" fill="#6b8fa3"/>
    <text x="620" y="254" font-size="11" fill="#6b8fa3">Background, not urgent</text>
  </g>

  <!-- priority actions panel -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="40" y="292" width="820" height="80" rx="12" fill="#fffefb" stroke="#e6ded2"/>
    <text x="60" y="316" font-size="15" fill="#262220" font-family="Georgia, serif">Priority actions</text>
    <circle cx="65" cy="335" r="2.5" fill="#8a6a52"/>
    <text x="76" y="339" font-size="12" fill="#43403c">Confirm allergy history before every new patient &#8212; patient safety, act first.</text>
    <circle cx="65" cy="352" r="2.5" fill="#8a6a52"/>
    <text x="76" y="356" font-size="12" fill="#43403c">Log the consent discussion in the notes each time &#8212; compliance &amp; documentation.</text>
  </g>

  <!-- bottom row -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="40" y="392" width="400" height="132" rx="12" fill="#fffefb" stroke="#e6ded2"/>
    <text x="60" y="416" font-size="14" fill="#262220" font-family="Georgia, serif">Reflective draft</text>
    <g font-size="11.5" fill="#43403c">
      <text x="60" y="440">Went well</text>
      <line x1="60" y1="446" x2="380" y2="446" stroke="#efe9dd" stroke-width="1"/>
      <text x="60" y="463">Needs improvement</text>
      <line x1="60" y1="469" x2="380" y2="469" stroke="#efe9dd" stroke-width="1"/>
      <text x="60" y="486">Action plan</text>
      <line x1="60" y1="492" x2="380" y2="492" stroke="#efe9dd" stroke-width="1"/>
      <text x="60" y="509">Feelings &#183; Key takeaway</text>
    </g>

    <rect x="460" y="392" width="400" height="132" rx="12" fill="#fffefb" stroke="#e6ded2"/>
    <text x="480" y="416" font-size="14" fill="#262220" font-family="Georgia, serif">By category</text>
    <circle cx="565" cy="465" r="38" fill="none" stroke="#efe9dd" stroke-width="16"/>
    <circle cx="565" cy="465" r="38" fill="none" stroke="#8a6a52" stroke-width="16" stroke-dasharray="70 179"/>
    <circle cx="565" cy="465" r="38" fill="none" stroke="#7f9b6b" stroke-width="16" stroke-dasharray="45 179" stroke-dashoffset="-70"/>
    <circle cx="565" cy="465" r="38" fill="none" stroke="#c98f6b" stroke-width="16" stroke-dasharray="35 179" stroke-dashoffset="-115"/>
    <circle cx="565" cy="465" r="38" fill="none" stroke="#6b8fa3" stroke-width="16" stroke-dasharray="29 179" stroke-dashoffset="-150"/>
    <g font-size="10.5" fill="#837b73">
      <circle cx="650" cy="446" r="4" fill="#8a6a52"/><text x="660" y="450">Professionalism</text>
      <circle cx="650" cy="464" r="4" fill="#7f9b6b"/><text x="660" y="468">Patient Safety</text>
      <circle cx="650" cy="482" r="4" fill="#c98f6b"/><text x="660" y="486">Communication</text>
      <circle cx="650" cy="500" r="4" fill="#6b8fa3"/><text x="660" y="504">Documentation</text>
    </g>
  </g>
</svg>
