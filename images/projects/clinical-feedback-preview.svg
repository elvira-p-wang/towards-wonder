<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="540" fill="#f7f4ee" rx="14"/>

  <!-- browser chrome -->
  <rect x="0" y="0" width="900" height="34" fill="#efe9dd" rx="14"/>
  <rect x="0" y="20" width="900" height="14" fill="#efe9dd"/>
  <circle cx="22" cy="17" r="5" fill="#e2b3a8"/>
  <circle cx="40" cy="17" r="5" fill="#e6d2a0"/>
  <circle cx="58" cy="17" r="5" fill="#a9c9b3"/>

  <!-- header -->
  <text x="40" y="78" font-size="15" letter-spacing="2" fill="#837b73" font-family="Helvetica, Arial, sans-serif">CLINICAL FEEDBACK TO ACTION &#183; REFLECTION TOOL</text>
  <text x="40" y="112" font-size="33" fill="#262220">Feedback to Action</text>
  <text x="40" y="136" font-size="14" fill="#837b73" font-family="Helvetica, Arial, sans-serif">Turns placement feedback into reflections you&#8217;ll actually finish writing.</text>

  <!-- left: raw pasted feedback -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="40" y="150" width="360" height="374" rx="12" fill="#fffefb" stroke="#e6ded2"/>
    <text x="60" y="176" font-size="11" letter-spacing="1" fill="#837b73">PASTE FEEDBACK</text>

    <text x="60" y="204" font-size="12" fill="#6b6459">- pt care good, but visibly rushed</text>
    <text x="60" y="228" font-size="12" fill="#6b6459">- please ensure allergy hx checked always</text>
    <text x="60" y="252" font-size="12" fill="#6b6459">- well done explaining tx plan to family</text>
    <text x="60" y="276" font-size="12" fill="#6b6459">- consent form left unsigned</text>
    <text x="60" y="300" font-size="12" fill="#6b6459">- forgot glove change between ops</text>

    <rect x="60" y="456" width="300" height="40" rx="20" fill="#9b5f44"/>
    <text x="210" y="481" font-size="13" font-weight="600" text-anchor="middle" fill="#fffefb">Parse &amp; Generate Reflection</text>
  </g>

  <!-- arrow -->
  <text x="402" y="349" font-size="30" fill="#9b5f44" font-family="Helvetica, Arial, sans-serif">&#8594;</text>

  <!-- right: sorted output -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="440" y="150" width="420" height="374" rx="12" fill="#fffefb" stroke="#e6ded2"/>
    <text x="460" y="176" font-size="11" letter-spacing="1" fill="#837b73">SORTED OUTPUT</text>

    <!-- tags -->
    <rect x="460" y="192" width="88" height="24" rx="12" fill="rgba(85,128,107,0.12)"/>
    <text x="504" y="208" font-size="10.5" letter-spacing="0.5" text-anchor="middle" fill="#55806b">STRENGTH</text>
    <rect x="558" y="192" width="112" height="24" rx="12" fill="rgba(175,124,63,0.12)"/>
    <text x="614" y="208" font-size="10.5" letter-spacing="0.5" text-anchor="middle" fill="#af7c3f">GROWTH AREA</text>
    <rect x="680" y="192" width="82" height="24" rx="12" fill="rgba(107,143,163,0.12)"/>
    <text x="721" y="208" font-size="10.5" letter-spacing="0.5" text-anchor="middle" fill="#6b8fa3">CONTEXT</text>

    <!-- priority actions -->
    <text x="460" y="246" font-size="14" fill="#262220" font-family="Georgia, serif">Priority actions</text>

    <circle cx="468" cy="264" r="9" fill="#af7c3f"/>
    <text x="468" y="267.5" font-size="10" text-anchor="middle" fill="#fffefb">1</text>
    <text x="486" y="268" font-size="12" fill="#43403c">Confirm allergy history before next patient</text>

    <circle cx="468" cy="292" r="9" fill="#af7c3f"/>
    <text x="468" y="295.5" font-size="10" text-anchor="middle" fill="#fffefb">2</text>
    <text x="486" y="296" font-size="12" fill="#43403c">Log the consent discussion at every visit</text>

    <line x1="460" y1="316" x2="840" y2="316" stroke="#e6ded2"/>

    <!-- reflective draft -->
    <text x="460" y="340" font-size="14" fill="#262220" font-family="Georgia, serif">Reflective draft</text>
    <text x="460" y="364" font-size="11.5" fill="#43403c">Went well</text>
    <line x1="460" y1="370" x2="840" y2="370" stroke="#efe9dd"/>
    <text x="460" y="390" font-size="11.5" fill="#43403c">Needs improvement</text>
    <line x1="460" y1="396" x2="840" y2="396" stroke="#efe9dd"/>
    <text x="460" y="416" font-size="11.5" fill="#43403c">Action plan</text>
    <line x1="460" y1="422" x2="840" y2="422" stroke="#efe9dd"/>
    <text x="460" y="442" font-size="11.5" fill="#43403c">Feelings &#183; Key takeaway</text>
  </g>
</svg>
