<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="540" fill="#f7f4ee" rx="14"/>

  <!-- browser chrome -->
  <rect x="0" y="0" width="900" height="34" fill="#efe9dd" rx="14"/>
  <rect x="0" y="20" width="900" height="14" fill="#efe9dd"/>
  <circle cx="22" cy="17" r="5" fill="#e2b3a8"/>
  <circle cx="40" cy="17" r="5" fill="#e6d2a0"/>
  <circle cx="58" cy="17" r="5" fill="#a9c9b3"/>

  <!-- header -->
  <text x="40" y="78" font-size="15" letter-spacing="2" fill="#837b73" font-family="Helvetica, Arial, sans-serif">CLINICAL ATLAS &#183; STUDY REFERENCE</text>
  <text x="40" y="112" font-size="36" fill="#262220">Clinical Atlas</text>
  <text x="40" y="136" font-size="14" fill="#837b73" font-family="Helvetica, Arial, sans-serif">17 modules, reorganised the way you&#8217;d actually revise.</text>

  <!-- overview cards -->
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- card 1 -->
    <rect x="40" y="160" width="260" height="112" rx="12" fill="#fffefb" stroke="#e6ded2"/>
    <text x="60" y="188" font-size="11" letter-spacing="1" fill="#837b73">MODULE GROUPS</text>
    <text x="60" y="216" font-size="24" fill="#262220" font-family="Georgia, serif">5</text>
    <rect x="60" y="230" width="220" height="5" rx="2.5" fill="#efe9dd"/>
    <rect x="60" y="230" width="220" height="5" rx="2.5" fill="#55806b"/>
    <text x="60" y="254" font-size="11" fill="#55806b">Foundations to Cross-Procedure</text>

    <!-- card 2 -->
    <rect x="320" y="160" width="260" height="112" rx="12" fill="#fffefb" stroke="#e6ded2"/>
    <text x="340" y="188" font-size="11" letter-spacing="1" fill="#837b73">TOPIC MODULES</text>
    <text x="340" y="216" font-size="24" fill="#262220" font-family="Georgia, serif">17</text>
    <rect x="340" y="230" width="220" height="5" rx="2.5" fill="#efe9dd"/>
    <rect x="340" y="230" width="220" height="5" rx="2.5" fill="#af7c3f"/>
    <text x="340" y="254" font-size="11" fill="#af7c3f">Every placement note, reorganised</text>

    <!-- card 3 -->
    <rect x="600" y="160" width="260" height="112" rx="12" fill="#fffefb" stroke="#e6ded2"/>
    <text x="620" y="188" font-size="11" letter-spacing="1" fill="#837b73">PATIENT INFO REMOVED</text>
    <text x="620" y="216" font-size="24" fill="#262220" font-family="Georgia, serif">100%</text>
    <rect x="620" y="230" width="220" height="5" rx="2.5" fill="#efe9dd"/>
    <rect x="620" y="230" width="220" height="5" rx="2.5" fill="#55806b"/>
    <text x="620" y="254" font-size="11" fill="#55806b">De-identified by design</text>
  </g>

  <!-- comparison panel -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="40" y="292" width="820" height="80" rx="12" fill="#fffefb" stroke="#e6ded2"/>
    <text x="60" y="316" font-size="15" fill="#262220" font-family="Georgia, serif">Cross-procedure comparison</text>
    <circle cx="65" cy="335" r="2.5" fill="#8a6a52"/>
    <text x="76" y="339" font-size="12" fill="#43403c">SSC vs GIC &#8212; indication, longevity, and cost, compared side by side.</text>
    <circle cx="65" cy="352" r="2.5" fill="#8a6a52"/>
    <text x="76" y="356" font-size="12" fill="#43403c">SDF vs SSC &#8212; when to arrest, when to restore.</text>
  </g>

  <!-- bottom row -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="40" y="392" width="400" height="132" rx="12" fill="#fffefb" stroke="#e6ded2"/>
    <text x="60" y="416" font-size="14" fill="#262220" font-family="Georgia, serif">Module map</text>
    <g font-size="11.5" fill="#43403c">
      <circle cx="65" cy="438" r="3" fill="#8a6a52"/><text x="76" y="442">Foundations</text>
      <circle cx="65" cy="458" r="3" fill="#7f9b6b"/><text x="76" y="462">Prevention</text>
      <circle cx="65" cy="478" r="3" fill="#c98f6b"/><text x="76" y="482">Clinical Procedures</text>
      <circle cx="65" cy="498" r="3" fill="#6b8fa3"/><text x="76" y="502">Behaviour &amp; Reasoning</text>
      <circle cx="220" cy="438" r="3" fill="#9b5f44"/><text x="231" y="442">Cross-Procedure</text>
    </g>

    <rect x="460" y="392" width="400" height="132" rx="12" fill="#fffefb" stroke="#e6ded2"/>
    <text x="480" y="416" font-size="14" fill="#262220" font-family="Georgia, serif">Live search</text>
    <rect x="480" y="432" width="360" height="34" rx="17" fill="#f7f4ee" stroke="#e6ded2"/>
    <circle cx="500" cy="449" r="6" fill="none" stroke="#837b73" stroke-width="1.6"/>
    <line x1="504.5" y1="453.5" x2="509" y2="458" stroke="#837b73" stroke-width="1.6"/>
    <text x="518" y="453" font-size="12" fill="#837b73">Search e.g. &#8220;ICDAS&#8221;, &#8220;SSC&#8221;, &#8220;risks&#8221;&#8230;</text>
    <g font-size="10.5" fill="#8a6a52">
      <rect x="480" y="480" width="70" height="22" rx="11" fill="rgba(155,95,68,0.08)"/>
      <text x="497" y="494" text-anchor="middle">ICDAS</text>
      <rect x="558" y="480" width="58" height="22" rx="11" fill="rgba(155,95,68,0.08)"/>
      <text x="587" y="494" text-anchor="middle">SSC</text>
      <rect x="624" y="480" width="94" height="22" rx="11" fill="rgba(155,95,68,0.08)"/>
      <text x="671" y="494" text-anchor="middle">LA blocks</text>
    </g>
  </g>
</svg>
