<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="540" fill="#f7f4ee" rx="14"/>

  <!-- browser chrome -->
  <rect x="0" y="0" width="900" height="34" fill="#efe9dd" rx="14"/>
  <rect x="0" y="20" width="900" height="14" fill="#efe9dd"/>
  <circle cx="22" cy="17" r="5" fill="#e2b3a8"/>
  <circle cx="40" cy="17" r="5" fill="#e6d2a0"/>
  <circle cx="58" cy="17" r="5" fill="#a9c9b3"/>

  <!-- header -->
  <text x="40" y="78" font-size="15" letter-spacing="2" fill="#837b73" font-family="Helvetica, Arial, sans-serif">CLINICAL ATLAS &#183; REFERENCE HUB</text>
  <text x="40" y="112" font-size="36" fill="#262220">Clinical Atlas</text>
  <text x="40" y="136" font-size="14" fill="#837b73" font-family="Helvetica, Arial, sans-serif">17 modules, reorganised the way you&#8217;d actually revise.</text>

  <!-- search bar -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="40" y="150" width="820" height="34" rx="17" fill="#fffefb" stroke="#e6ded2"/>
    <circle cx="62" cy="167" r="6" fill="none" stroke="#837b73" stroke-width="1.6"/>
    <line x1="66.5" y1="171.5" x2="71" y2="176" stroke="#837b73" stroke-width="1.6"/>
    <text x="80" y="171" font-size="12" fill="#837b73">Search e.g. &#8220;ICDAS&#8221;, &#8220;SSC&#8221;, &#8220;risks&#8221;&#8230;</text>
  </g>

  <!-- module sidebar -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="40" y="200" width="210" height="324" rx="12" fill="#fffefb" stroke="#e6ded2"/>
    <text x="60" y="228" font-size="11" letter-spacing="1" fill="#837b73">MODULES</text>

    <text x="60" y="260" font-size="12.5" fill="#43403c">Foundations</text>
    <text x="60" y="290" font-size="12.5" fill="#43403c">Prevention</text>

    <rect x="50" y="304" width="190" height="28" rx="8" fill="rgba(155,95,68,0.1)"/>
    <text x="60" y="322" font-size="12.5" font-weight="600" fill="#262220">Clinical Procedures</text>

    <text x="60" y="354" font-size="12.5" fill="#43403c">Behaviour &amp; Reasoning</text>
    <text x="60" y="384" font-size="12.5" fill="#43403c">Cross-Procedure</text>
  </g>

  <!-- main article -->
  <g>
    <rect x="270" y="200" width="590" height="324" rx="12" fill="#fffefb" stroke="#e6ded2"/>
    <text x="292" y="226" font-size="11" letter-spacing="1" fill="#837b73" font-family="Helvetica, Arial, sans-serif">CLINICAL PROCEDURES</text>
    <text x="292" y="252" font-size="18" fill="#262220">Stainless Steel Crowns</text>

    <!-- comparison table -->
    <g font-family="Helvetica, Arial, sans-serif" font-size="11.5">
      <line x1="292" y1="272" x2="828" y2="272" stroke="#e6ded2"/>
      <line x1="292" y1="300" x2="828" y2="300" stroke="#e6ded2"/>
      <line x1="292" y1="328" x2="828" y2="328" stroke="#e6ded2"/>
      <line x1="292" y1="356" x2="828" y2="356" stroke="#e6ded2"/>
      <line x1="292" y1="272" x2="292" y2="356" stroke="#e6ded2"/>
      <line x1="452" y1="272" x2="452" y2="356" stroke="#e6ded2"/>
      <line x1="667" y1="272" x2="667" y2="356" stroke="#e6ded2"/>
      <line x1="828" y1="272" x2="828" y2="356" stroke="#e6ded2"/>

      <text x="302" y="290" fill="#837b73">Compare</text>
      <text x="559" y="290" text-anchor="middle" font-weight="600" fill="#8a6a52">SSC</text>
      <text x="747" y="290" text-anchor="middle" font-weight="600" fill="#6b8fa3">GIC</text>

      <text x="302" y="318" fill="#262220">Indication</text>
      <text x="559" y="318" text-anchor="middle" fill="#43403c">High-risk pulp tx</text>
      <text x="747" y="318" text-anchor="middle" fill="#43403c">Low-risk fillings</text>

      <text x="302" y="346" fill="#262220">Longevity</text>
      <text x="559" y="346" text-anchor="middle" fill="#43403c">Years, durable</text>
      <text x="747" y="346" text-anchor="middle" fill="#43403c">Moderate, wears</text>
    </g>

    <!-- de-identified vignette -->
    <g font-family="Helvetica, Arial, sans-serif">
      <text x="292" y="392" font-size="11" letter-spacing="1" fill="#837b73">DE-IDENTIFIED VIGNETTE</text>
      <rect x="292" y="402" width="3" height="48" fill="#9b5f44"/>
      <text x="306" y="418" font-size="12.5" font-style="italic" fill="#43403c" font-family="Georgia, serif">&#8220;A 9-year-old, high caries risk &#8212; full</text>
      <text x="306" y="438" font-size="12.5" font-style="italic" fill="#43403c" font-family="Georgia, serif">coverage, or a direct restoration?&#8221;</text>
    </g>
  </g>
</svg>
